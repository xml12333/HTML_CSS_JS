<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="description"
      content="Discover delicious, creamy ice cream in refreshing flavors like mint chocolate chip, cookies and cream, and vanilla. Choose your favorite and order today.">
   <meta name="robots" content="index, follow">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!--=============== FAVICON ===============-->
   <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">

   <!--=============== REMIXICONS - (Insert link for icons) ===============-->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

   <!--=============== SWIPER CSS - (Insert link for swiperjs) ===============-->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.css">

   <!--=============== CSS ===============-->
   <link rel="stylesheet" href="./css/styles.css">

   <title>Delicious Ice Cream | Fresh & Creamy Flavors </title>
</head>
<body>
   <!--==================== HEADER ====================-->
   <header class="header" id="header">
      <nav class="nav container">
         <a href="/index.html" class="nav__logo">Ice Cream</a>

         <div class="nav__menu" id="nav-menu">
            <ul class="nav__list">
               <li>
                  <a href="#" class="nav__link active-link">Home</a>
               </li>

               <li>
                  <a href="#" class="nav__link">Menu</a>
               </li>

               <li>
                  <a href="#" class="nav__link">About</a>
               </li>

               <li>
                  <a href="#" class="nav__link">Contact</a>
               </li>
            </ul>

            <!-- Close -->
            <button class="nav__close" id="nav-close" aria-label="Close menu">
               <i class="ri-close-large-line"></i>
            </button>
         </div>

         <div class="nav__actions">
            <a href="#" class="nav__action" aria-label="Account">
               <i class="ri-account-circle-line"></i>
            </a>

            <a href="#" class="nav__action" aria-label="Shopping bag">
               <i class="ri-shopping-bag-3-line"></i>
            </a>

            <!-- Toggle -->
            <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
               <i class="ri-apps-2-line"></i>
            </button>
         </div>
      </nav>
   </header>

   <!--==================== MAIN ====================-->
   <main class="main">
      <!--==================== HOME ====================-->
      <section class="home">
         <div class="home__bg home__green active-bg"></div>
         <div class="home__bg home__brown"></div>
         <div class="home__bg home__blue"></div>
         <div class="home__container container">
            <div class="home__swiper">
               <div>
                  <article class="home__card">
                     <img src="./img/ice-cream-1.png" alt="Mint chocolate chip ice cream" class="home__img">
                  </article>
                  <article class="home__card">
                     <img src="./img/ice-cream-2.png" alt="Cookies and cream ice cream" class="home__img">
                  </article>
                  <article class="home__card">
                     <img src="./img/ice-cream-3.png" alt="Vanilla ice cream" class="home__img">
                  </article>
               </div>
            </div>
            <div class="home__data">
               <h1 class="home__title">Delicious <br> Ice Cream</h1>
               <p class="home__description">A refreshing ice cream, crafted to turn every spoonful
                  into a moment of sweetness, freshness, and pleasure.</p>
               <div class="home__buttons">
                  <a href="#" class="home__button">Order Now</a>
                  <a href="#" class="home__button home__button-ghost">View Flavors</a>
               </div>
            </div>
            <img src="./img/waves-img.svg" alt="img" class="home__wave">
            <div class="home__buttom">
               <div class="home__arrows"></div>
               <div class="home__reviews">
                  <div class="home__people">
                     <img src="./img/review-1.png" alt="img" class="home__person">
                     <img src="./img/review-2.png" alt="img" class="home__person">
                     <img src="./img/review-3.png" alt="img" class="home__person">
                  </div>
                  <div>
                     <h3 class="home__reviews-title">10K Reviews</h3>
                     <p class="home__reviews-description">Our customers prefer us.</p>
                  </div>
               </div>
            </div>
         </div>
      </section>
   </main>

   <!--=============== GSAP - (Insert link for animations) ===============-->
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

   <!--=============== SWIPER JS - (Insert link for swiperjs) ===============-->
   <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.js"></script>

   <!--=============== MAIN JS ===============-->
   <script src="./js/main.js"></script>
</body>
</html>
