<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline Grid</title>
</head>

<body>
    <h1>Timeline Grid</h1>
    <div class="timeline-scroll-container">
        <div class="grid-timeline" id="grid-timeline">
            <div class="header-container">
                <div class="header-row">7:30 AM</div>
                <div class="header-row">8:00 AM</div>
                <div class="header-row">8:30 AM</div>
                <div class="header-row">9:00 AM</div>
                <div class="header-row">9:30 AM</div>
                <div class="header-row">10:00 AM</div>
                <div class="header-row">10:30 AM</div>
                <div class="header-row">11:00 AM</div>
                <div class="header-row">11:30 AM</div>
                <div class="header-row">12:00 PM</div>
                <div class="header-row">12:30 PM</div>
                <div class="header-row">1:00 PM</div>
                <div class="header-row">1:30 PM</div>
                <div class="header-row">2:00 PM</div>
                <div class="header-row">2:30 PM</div>
                <div class="header-row">3:00 PM</div>
                <div class="header-row">3:30 PM</div>
                <div class="header-row">4:00 PM</div>
                <div class="header-row">4:30 PM</div>
                <div class="header-row">5:00 PM</div>
            </div>
            <div class="row-background">
                <div class="row-cells">
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                </div>
                <div class="row-data">
                    <div class="block" data-color="red" style="--col-start: 1; --col-end: 3">
                        1 hr
                    </div>
                    <div class="block" data-color="green" style="--col-start: 3; --col-end: 4">
                        30m
                    </div>
                    <div class="block" data-color="yellow" style="--col-start: 4; --col-end: 8">
                        2 hrs
                    </div>
                    <div class="block" data-color="navy" style="--col-start: 8; --col-end: 21">
                        6.5 hrs
                    </div>
                </div>
            </div>
            <div class="row-background">
                <div class="row-cells">
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                </div>
                <div class="row-data">
                    <div class="block" data-color="purple" style="--col-start: 1; --col-end: 6">
                        2.5 hrs
                    </div>
                    <div class="block" data-color="blue" style="--col-start: 6; --col-end: 12">
                        3 hrs
                    </div>
                    <div class="block" data-color="orange" style="--col-start: 15; --col-end: 20">
                        2.5 hrs
                    </div>
                </div>
            </div>
            <div class="row-background">
                <div class="row-cells">
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                    <div class="row-cell"></div>
                </div>
                <div class="row-data">
                    <div class="block" data-color="teal" style="--col-start: 2; --col-end: 10">
                        4 hrs
                    </div>
                    <div class="block" data-color="sky" style="--col-start: 10; --col-end: 18">
                        4 hrs
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
