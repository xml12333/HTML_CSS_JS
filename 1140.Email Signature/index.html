<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Email Signature</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap");
      @import url('https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&display=swap');
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      table:hover span.img-container {
        background: url(https://josetxu.com/wp-content/themes/josetxu-code/images/profile.gif) no-repeat center center #fff !important;
        background-size: cover !important;
        transform: rotate(deg) !important;
      }
    </style>
  </head>
  <body>
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="max-width: 650px;
        margin: 0 auto;
        border-radius: 0 4px 0 0;
        font-size: 14px;
        line-height: 20px;
        background: 
        linear-gradient(95deg, #fff0 0 calc(100% - 22px), #fff calc(100% - 21px)),
        linear-gradient(185deg, #fff0 0 calc(100% - 29px), #fff calc(100% - 28px) 100%), 
        linear-gradient(177deg, #fff0 0  calc(100% - 32px), #fff calc(100% - 31px) 100%), 
        linear-gradient(185deg, #fff0 0 calc(100% - 40px), #2292dd calc(100% - 38px) calc(100% - 29px), #fff0 calc(100% - 28px) 100%), 
        linear-gradient(177deg, #fff0 0 calc(100% - 40px), #2292dd calc(100% - 39px) calc(100% - 32px), #fff0 calc(100% - 31px) 100%), 
        linear-gradient(177deg, #fff0 0 calc(100% - 40px), #fff calc(100% - 39px)), 
        linear-gradient(185deg, #fff0 0 calc(100% - 31px), #fff calc(100% - 30px)), 
        linear-gradient(95deg, #fff0 0 calc(100% - 31px), #fff calc(100% - 30px)), 
        linear-gradient(178deg, #fff 0 40px, #000 41px 100px, #fff0 0 100%), 
        linear-gradient(95deg, #fff0 37px, #000 38px calc(100% - 31px), #fff0 calc(100% - 30px));">
      <tr>
        <td style="padding: 10px 0">
          <table border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td style="width: 230px;">
                <span class="img-container" style="display: inline-block;
                  width: 160px;
                  height: 160px;
                  overflow: hidden;
                  border-radius: 1px;
                  transform: rotate(-2deg);
                  box-shadow: 0 0 0 10px #000, 0 0 0 20px #fff;
                  background: url(https://josetxu.com/wp-content/themes/josetxu-code/images/profile.jpg) no-repeat center center;
                  background-color: #fff;
                  background-size: cover;
                  transition: all 0.25s ease-in-out;">
                </span>
                    
              </td>
              <td style="display: inline-flex;
                flex-direction: column;">
                  <div style="color: #2292dd;
                    font-size:30px;
                    font-family: 'Gluten', Arial, Helvetica, sans-serif;
                    font-weight:500;
                    width: 230px;
                    line-height: 36px;
                    padding: 0px 27px 10px;
                    background:  linear-gradient(40deg, #000 0 10px, #2292dd 11px 18px, #fff0 19px), linear-gradient(-53deg, #fff0 0 10px, #2292dd 11px 18px, #fff0 19px),  linear-gradient(-55deg, #000 0 10px, #2292dd 11px 18px, #fff0 19px), linear-gradient(1deg,  #2292dd 0px 8px, #fff0 9px 100%), #fff;">
                    <div style="transform: scaleY(1.2);">Josetxu López</div>
                  </div>
                  <div style="color:#fff;
                    font-weight:normal;
                    font-size: 26px;
                    text-align: center;
                    padding: 30px 0px 50px 0px;
                    transform: rotate(-2deg);
                    font-family: 'Open Sans', Arial, Helvetica, sans-serif;">
                    &lt;/ Senior Web Developer &gt;
                  </div>
                  <div style="color:#2292dd;
                    font-family: 'Gluten', Arial, Helvetica, sans-serif;
                    font-weight:normal;
                    font-size: 23px;
                    text-align: center;
                    padding: 0px 0px 20px 0px;
                    transform: rotate(1deg);
                    word-spacing: 1px;
                    transform: scaleY(1.2);">
                    HTML &bullet; 
                    CSS &bullet;
                    PHP &bullet;
                    JS &bullet;
                    SQL 
                  </div>
              </td>
            </tr>
          </table>

          <table border="0" cellpadding="0" cellspacing="0" width="100%" style="font-size: 23px; height: 80px; margin-bottom: 20px;">
            <tr>
              <td style="padding-bottom: 3px">
                <ul style="list-style: none;
                  padding: 0;
                  margin: 0 0 0 60px;
                  font-size: 20px;
                  font-family: 'Open Sans', Arial, Helvetica, sans-serif;">
                  <li style="display: inline-block;
                    margin-right: 25px;
                    position: relative;
                    top: 5px;
                    transform: rotate(3deg);">
                    <a href="#" style="text-decoration: none; color: #fff;"><img src="https://cdn.josetxu.com/img/icon-codepen.png" alt="Codepen" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 5px; clip-path: polygon(1% 2%, 96% 6%, 99% 98%, 1% 93%);">Codepen</a>
                  </li>
                  <li style="display: inline-block;
                    margin-right: 25px;
                    position: relative;
                    top: 10px;
                    transform: rotate(-3deg);">
                    <a href="#" style="text-decoration: none; color: #fff;"><img src="https://cdn.josetxu.com/img/icon-linkedin.png" alt="Linkedin" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 5px; clip-path: polygon(3% 3%, 92% 8%, 97% 98%, 2% 96%);">Linkedin</a>
                  </li>
                  <li style="display: inline-block;
                    margin-right: 25px;
                    transform: rotate(-3deg);">
                    <a href="#" style="text-decoration: none; color: #fff;"><img src="https://cdn.josetxu.com/img/icon-website.png" alt="Website" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 5px; clip-path:polygon(9% 5%, 100% 5%, 93% 91%, 1% 98%)">Website</a>
                  </li>
                  <li style="display: inline-block;
                    margin-right: 25px;
                    position: relative;
                    top: -8px;
                    transform: rotate(-3deg);">
                    <a href="#" style="text-decoration: none; color: #fff;"><img src="https://cdn.josetxu.com/img/icon-email.png" alt="Email" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 5px; clip-path: polygon(3% 3%, 92% 8%, 100% 95%, 2% 90%);">Email</a>
                  </li>
                </ul>     
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
